# LocAssess codebook (SPEC §5.2)
#
# Used twice: as the model instruction in Stage 1 and as the annotation guideline for the
# manual gold standard. Entries generated by `locassess codebook-draft` have status: draft.
# Review each entry, edit it as needed, then set `status: reviewed`.
# Reviewed entries are never overwritten by `codebook-draft --force`.
# `name` and `sub_criteria` must stay identical to data/criteria.csv.

version: '0.1'
draft_generated_with:
  model: gpt-4.1
  prompt: codebook_draft 1.0
  date: '2026-10-13'
direction_definition: +1 = makes the location more attractive for a production site; -1 = less attractive;
  0 = mentioned without a clear direction
intensity_definition:
  1: minor or local effect, single event
  2: noticeable effect on companies in the region
  3: major effect that would change a location decision
evidence_type_definition:
  fact: has happened / is in force
  announcement: planned, announced, decided but not yet implemented
  opinion: assessment, forecast, criticism, expectation
criteria:
  H01:
    status: draft
    name: Natural resources
    factor: Physical factors
    definition: This criterion assesses whether a production location offers access to essential natural
      resources needed for industrial operations. It includes the availability and quality of raw materials,
      reliable power and water supply, sufficient land for current use and future expansion, as well as
      favorable climate and geographic conditions. Evidence for this criterion includes any mention of
      these sub-criteria as factors influencing the attractiveness of a site for production.
    notes: Do not include references to transportation infrastructure (see H02), proximity to markets
      (see H16), or environmental regulations (see H07). Only code statements that refer to the physical
      presence or availability of natural resources or site conditions, not their cost (see H12) or environmental
      impact (see H06).
    sub_criteria:
    - H01.01 Raw material
    - H01.02 Power supply
    - H01.03 Water supply
    - H01.04 Land availability
    - H01.05 Room for expansion
    - H01.06 Favorable climate
    - H01.07 Favorable geography
    positive_examples:
    - The region offers abundant water resources and a stable electricity supply for manufacturers.
    - Companies are attracted by the large tracts of land available for new factories and future expansion.
    - The area's mild climate and flat terrain make it ideal for year-round industrial operations.
    negative_examples:
    - Frequent power outages in the region have disrupted factory operations.
    - Limited access to clean water has deterred new investments in the area.
    - The lack of suitable land for industrial development is a major concern for potential investors.
    search_terms:
    - raw material supply
    - power supply
    - electricity availability
    - water supply
    - land availability
    - industrial land
    - room for expansion
    - climate conditions
    - geographic advantages
    - natural resources
    - energy supply
    - site suitability
  H02:
    status: draft
    name: Transportation system
    factor: Physical factors
    definition: This criterion assesses the availability, quality, and connectivity of transportation
      infrastructure at or near a production location, including railways, highways, seaports, and airports.
      Evidence for this criterion includes any mention of how these transport systems facilitate or hinder
      the movement of goods, materials, or personnel to and from the site. Coders should look for references
      to the presence, absence, or condition of these specific transport modes (H02.01 Railway, H02.02
      Highway, H02.03 Seaport, H02.04 Airport) as factors influencing site selection.
    notes: Do not include general references to geographic distance (see H03 Distance) or spatial relationships
      to other facilities (see H04 Spatial relation). This criterion is limited to the physical infrastructure
      and operational status of transport systems, not the cost of transport (see H12 Cost/expenditure)
      or environmental impacts of transport (see H06 Environmental pollution).
    sub_criteria:
    - H02.01 Railway
    - H02.02 Highway
    - H02.03 Seaport
    - H02.04 Airport
    positive_examples:
    - The region boasts a newly expanded seaport, allowing for efficient export of manufactured goods.
    - A major highway runs adjacent to the industrial park, providing easy truck access for suppliers
      and distributors.
    - The site is located just 10 kilometers from an international airport, facilitating quick shipment
      of high-value products.
    negative_examples:
    - The region suffers from frequent railway disruptions, causing delays in raw material deliveries.
    - There is no direct highway access to the site, making logistics challenging for large shipments.
    - The nearest seaport is over 200 kilometers away, increasing transportation times and costs.
    search_terms:
    - railway access
    - highway connection
    - seaport proximity
    - airport nearby
    - logistics hub
    - transport infrastructure
    - freight terminal
    - cargo handling
    - road network
    - rail freight
    - port facilities
    - airport cargo services
  H03:
    status: draft
    name: Distance
    factor: Physical factors
    definition: This criterion assesses how the physical distance of a production location affects its
      attractiveness, focusing on proximity to key resources and infrastructure. It includes distance
      to markets (customers), natural resources (raw materials), labor resources (workforce), higher educational
      and research institutions, and access to distribution channels. Evidence for this criterion includes
      any mention of how close or far the site is from these important factors.
    notes: Do not include general mentions of transportation quality (see H02 Transportation system) or
      urban agglomeration effects (see H05 Urban agglomeration). Only code statements that specifically
      discuss distance or proximity to markets, resources, labor, educational/research institutions, or
      distribution channels. Statements about the cost or quality of these factors without reference to
      distance should not be coded here.
    sub_criteria:
    - H03.01 Distance to market
    - H03.02 Distance to natural resource
    - H03.03 Distance to labor resource
    - H03.04 Approximate to higher educational and research institutions
    - H03.05 Access to distribution channels
    positive_examples:
    - The region is located just 20 kilometers from the main consumer market.
    - The new plant is situated near major raw material suppliers.
    - The site offers easy access to several universities and research centers.
    negative_examples:
    - The factory is far from major distribution hubs, increasing delivery times.
    - The region is distant from skilled labor pools.
    - The site is located hundreds of miles from key natural resources.
    search_terms:
    - close to market
    - near raw materials
    - distance to suppliers
    - proximity to labor
    - far from customers
    - access to universities
    - distance to research centers
    - near distribution center
    - remote location
    - distance from workforce
    - close to distribution channels
    - proximity to resources
  H04:
    status: draft
    name: Spatial relation
    factor: Physical factors
    definition: Spatial relation refers to how the physical arrangement and connections of a production
      location—such as its spatial properties, business linkages, and zoning changes—affect the likelihood
      of business success or failure. Evidence for this criterion includes information about how the site's
      spatial characteristics, its integration with other businesses or industries, or changes in zoning
      regulations influence its suitability for production. Sub-criteria include the impact of spatial
      properties on business outcomes (H04.01), the presence or absence of business linkages (H04.02),
      and any changes in zoning that affect industrial use (H04.03).
    notes: Do not include general references to distance (H03) or transportation infrastructure (H02)
      unless they specifically relate to spatial integration or zoning. Exclude mentions of environmental
      pollution (H06) or urban agglomeration (H05) unless they directly discuss spatial relationships
      or zoning changes. Focus on how the site's spatial context or regulatory changes impact business
      operations or connections.
    sub_criteria:
    - H04.01 Spatial properties (relation impact to business failure or success)
    - H04.02 Linkages
    - H04.03 Zoning change
    positive_examples:
    - The region's new industrial park is designed to cluster suppliers and manufacturers together, boosting
      collaboration.
    - Recent zoning changes in the region now allow for mixed-use industrial development, attracting more
      businesses.
    - The site benefits from strong linkages to nearby logistics hubs and partner companies.
    negative_examples:
    - The region's fragmented zoning makes it difficult for related businesses to operate in proximity.
    - Lack of spatial integration with other industries has led to business closures in the area.
    - Recent zoning restrictions have limited the expansion of manufacturing facilities in the region.
    search_terms:
    - zoning change
    - industrial zoning
    - business cluster
    - industrial park
    - business linkage
    - site integration
    - mixed-use development
    - industrial corridor
    - proximity to suppliers
    - business park
    - zoning restrictions
    - industrial land use
  H05:
    status: draft
    name: Urban agglomeration
    factor: Physical factors
    definition: Urban agglomeration refers to the concentration of population, businesses, and infrastructure
      in a city or metropolitan area, which can provide advantages for companies choosing a production
      location. Evidence for this criterion includes references to the presence of large cities, industrial
      clusters, or dense urban environments that offer access to suppliers, customers, and a skilled workforce.
      This criterion is not subdivided and covers the general benefits or drawbacks of being located within
      or near an urban agglomeration.
    notes: Do not include references to transportation infrastructure (see H02), specific distances to
      markets or suppliers (see H03), or economic agglomeration effects like shared services or cost savings
      (see H19). Focus on the overall presence and scale of urban concentration, not on individual infrastructure
      or economic benefits unless they are directly tied to the urban setting.
    sub_criteria: []
    positive_examples:
    - The region is part of a major metropolitan area with a population exceeding five million.
    - Several large manufacturers are already established in the region's urban core.
    - The region benefits from a dense network of businesses and service providers in the city center.
    negative_examples:
    - The region is located far from any major city or urban center.
    - There is little urban development in the area, with most of the population living in rural communities.
    - The lack of a significant urban agglomeration makes it harder to attract skilled workers.
    search_terms:
    - urban center
    - metropolitan area
    - city cluster
    - urban population
    - city infrastructure
    - urban growth
    - industrial city
    - urban hub
    - city region
    - urban development
    - urban density
    - urban business district
  H06:
    status: draft
    name: Environmental pollution
    factor: Environmental factors
    definition: Environmental pollution refers to the presence or absence of harmful substances in the
      air, water, or soil at or near a production location, which may affect the suitability of the site
      for industrial activities. This criterion covers evidence about the current state of pollution (e.g.,
      air, water, soil contamination) and its potential impact on operations, workforce, or product quality.
      Coders should look for information indicating whether pollution levels make the site more or less
      attractive for establishing or expanding production.
    notes: Do not include information about environmental regulations or requirements for pollution control
      (see H07 Requirements for environmental protection). This criterion focuses on the actual state
      of pollution, not on climate change risks (see H08 Climate change) or general quality of life (see
      H22 Quality of life). Only code evidence about pollution itself, not about policies or future risks.
    sub_criteria: []
    positive_examples:
    - The region boasts low levels of industrial emissions, making it ideal for manufacturing.
    - Recent reports confirm that water sources in the region remain uncontaminated by heavy metals.
    - Air quality in the region consistently meets international safety standards.
    negative_examples:
    - The region suffers from frequent air pollution due to nearby factories.
    - Soil contamination from past industrial activity remains a major concern in the region.
    - Local rivers in the region are heavily polluted, raising health and operational risks.
    search_terms:
    - air pollution
    - water contamination
    - soil pollution
    - industrial emissions
    - toxic waste
    - environmental contamination
    - polluted rivers
    - hazardous substances
    - clean air
    - pollution levels
    - environmental quality
    - factory pollution
  H07:
    status: draft
    name: Requirements for environmental protection
    factor: Environmental factors
    definition: This criterion covers the presence, stringency, and enforcement of environmental protection
      requirements at a production location, including laws, regulations, and standards that companies
      must comply with to operate. Evidence includes references to environmental permits, compliance obligations,
      or regulatory frameworks that affect how a company manages its environmental impact. Coders should
      identify whether the article discusses how these requirements influence the attractiveness of the
      location for production.
    notes: Do not include general mentions of environmental pollution (H06) unless they specifically relate
      to regulatory requirements or compliance. Exclude references to climate change impacts (H08) unless
      they are tied to legal or regulatory obligations. Focus on rules, standards, or enforcement actions,
      not on voluntary company initiatives or general environmental conditions.
    sub_criteria: []
    positive_examples:
    - The region offers streamlined environmental permitting processes for new factories.
    - Local authorities have clear and predictable environmental regulations, making compliance easier
      for manufacturers.
    - Recent updates to the region's environmental standards provide incentives for companies adopting
      green technologies.
    negative_examples:
    - Strict environmental regulations in the region increase costs and delay plant openings.
    - Uncertain enforcement of environmental laws makes the region less attractive for new industrial
      projects.
    - The region requires extensive environmental impact assessments before any production facility can
      be approved.
    search_terms:
    - environmental regulations
    - environmental permits
    - compliance requirements
    - environmental standards
    - regulatory approval
    - environmental impact assessment
    - environmental enforcement
    - green certification
    - pollution control laws
    - environmental compliance
    - environmental restrictions
    - environmental licensing
  H08:
    status: draft
    name: Climate change
    factor: Environmental factors
    definition: This criterion assesses how climate change and its impacts affect the suitability of a
      production location. Evidence includes references to the region's vulnerability or resilience to
      climate-related risks (e.g., extreme weather, rising temperatures, flooding, drought) and the presence
      of climate adaptation measures that could influence a company's decision to locate there. Consider
      whether climate change is likely to disrupt operations or supply chains at the site.
    notes: Do not include general environmental pollution (H06) or requirements for environmental protection
      (H07) unless they are specifically linked to climate change impacts. Exclude references to public
      health effects (H24, H25, H26) unless they directly relate to climate change. Focus on physical
      and operational risks or advantages due to climate change, not on broader environmental or regulatory
      issues.
    sub_criteria: []
    positive_examples:
    - The region has invested in flood defenses to protect industrial zones from rising sea levels.
    - Local authorities report that the area is less prone to heatwaves and drought compared to neighboring
      regions.
    - The region's stable climate reduces the risk of weather-related production disruptions.
    negative_examples:
    - Frequent flooding in the region has caused repeated shutdowns of manufacturing plants.
    - Rising temperatures have led to increased cooling costs for factories in the area.
    - The region is experiencing more severe storms, threatening supply chain reliability.
    search_terms:
    - extreme weather risk
    - flooding threat
    - heatwave impact
    - drought conditions
    - climate resilience
    - storm damage
    - rising sea levels
    - weather-related disruption
    - climate adaptation measures
    - temperature increase
    - natural disaster risk
    - climate vulnerability
  H09:
    status: draft
    name: Tax
    factor: Political factors
    definition: This criterion covers the tax environment at a potential production location, specifically
      focusing on local property taxes and the presence or absence of multiple types of taxes that would
      affect a company's operating costs. Evidence for this criterion includes any mention of tax rates,
      tax incentives, or the overall tax burden relevant to establishing or running a production facility
      in the region. Sub-criteria include local property tax (H09.01) and the existence of multiple taxes
      (H09.02) that may impact business decisions.
    notes: Do not include references to general government policy or legislation unless they specifically
      mention taxes. Distinguish this criterion from H10 (Local and national government legislation/Policy),
      which covers broader regulatory issues, and H12 (Cost/expenditure), which refers to non-tax operational
      costs. Only include statements directly related to taxes imposed on businesses or production sites.
    sub_criteria:
    - H09.01 Local property tax
    - H09.02 Multiple tax
    positive_examples:
    - The region offers a reduced property tax rate for new manufacturing plants.
    - Local authorities have introduced tax breaks for companies investing in the area.
    - Businesses in the region benefit from a single, streamlined tax system.
    negative_examples:
    - Companies face high property taxes in the region.
    - The region imposes multiple overlapping taxes on industrial operations.
    - Recent tax hikes have increased the cost of doing business in the area.
    search_terms:
    - property tax
    - business tax rate
    - tax incentives
    - tax breaks
    - corporate tax
    - tax burden
    - tax relief
    - tax exemption
    - tax increase
    - tax hike
    - tax structure
    - multiple taxes
  H10:
    status: draft
    name: Local and national government legislation/Policy
    factor: Political factors
    definition: This criterion covers the presence, absence, or specifics of local and national government
      legislation or policy that directly affects the attractiveness of a production location for companies.
      It includes policies such as financial incentives, industrial revenue bonds (including those for
      pollution control), land rent reductions, and cash grants for purposes like training or start-up
      costs. Evidence for this criterion is any mention of government actions, laws, or programs that
      provide direct financial or regulatory support or barriers to industrial investment at the site.
    notes: Do not include general economic conditions (see H13 Economic environment) or tax rates (see
      H09 Tax) unless they are part of a specific government policy or incentive program. Exclude references
      to environmental regulations unless they are tied to financial incentives or bonds for pollution
      control (otherwise see H07 Requirements for environmental protection). Focus on explicit government
      interventions or programs, not market-driven factors.
    sub_criteria:
    - H10.01 Financial incentives policy
    - H10.02 Industrial revenue bonds
    - H10.03 Industrial revenue bonds for pollution control
    - H10.04 Land rent reduction
    - H10.05 Cash grant assistance for purposes such as training, start-up cost
    positive_examples:
    - The region offers generous cash grants to manufacturers for workforce training.
    - Local authorities have introduced a new land rent reduction scheme for industrial investors.
    - The government recently issued industrial revenue bonds to support pollution control upgrades in
      factories.
    negative_examples:
    - The region has discontinued all financial incentives for new factories.
    - No government grants or subsidies are available for start-up costs in the area.
    - Local policies have increased land rent for industrial sites, making them less affordable.
    search_terms:
    - government incentive
    - industrial subsidy
    - cash grant
    - land rent reduction
    - financial assistance program
    - industrial revenue bond
    - pollution control bond
    - business grant
    - investment incentive
    - government support for industry
    - manufacturing subsidy
    - start-up cost assistance
  H11:
    status: draft
    name: Political status
    factor: Political factors
    definition: Political status refers to the overall political environment of a production location,
      including the structure and stability of government, the attitudes of local and state authorities
      toward business, and the protection of employment rights. Evidence for this criterion includes mentions
      of stable or unstable political systems, government support or opposition to industry, and the legal
      framework for workers' rights. Coders should look for information about how these political aspects
      might affect a company's decision to locate production in the region.
    notes: Do not include references to specific government policies or legislation (see H10), or to tax
      rates and incentives (see H09). This criterion focuses on the general political climate, stability,
      and government-business relations, not on specific laws or economic measures. Avoid coding general
      economic conditions (see H13) or public health governance (see H25) under this criterion.
    sub_criteria:
    - H11.01 Political structure
    - H11.02 Political stability
    - H11.03 Attitudes of local and state governments
    - H11.04 Employment rights
    positive_examples:
    - The region is known for its stable government and pro-business administration.
    - Local authorities have expressed strong support for new manufacturing investments.
    - The region guarantees strong employment rights, making it attractive for international companies.
    negative_examples:
    - Recent political unrest has raised concerns among potential investors in the region.
    - Frequent changes in local government have created uncertainty for businesses.
    - Labor rights are poorly protected, leading to criticism from international organizations.
    search_terms:
    - political stability
    - government support
    - political unrest
    - pro-business administration
    - local government attitude
    - state government stance
    - employment rights
    - labor rights protection
    - political risk
    - government-business relations
    - political environment
    - political uncertainty
  H12:
    status: draft
    name: Cost/expenditure
    factor: Economic factors
    definition: This criterion assesses the various costs and expenditures associated with establishing
      and operating a production location. It includes labor cost, land cost, transportation cost, energy
      cost, product cost, construction cost, utilities cost, cost of living in the area, cost of municipal
      services, and opportunity cost. Evidence for this criterion is any mention of these specific costs
      or general statements about the affordability or expense of running a facility in the region.
    notes: Do not include references to taxes (see H09 Tax), government incentives or regulations (see
      H10 Local and national government legislation/Policy), or broader economic conditions unrelated
      to specific costs (see H13 Economic environment). Focus only on direct or indirect costs relevant
      to operating a production site, not on market size, demand, or sales prices (see H16 Market).
    sub_criteria:
    - H12.01 Labor cost
    - H12.02 Land cost
    - H12.03 Transportation cost
    - H12.04 Energy cost
    - H12.05 Product cost
    - H12.06 Construction cost
    - H12.07 Utilities cost
    - H12.08 Cost of living in the area
    - H12.09 Cost of municipal services
    - H12.10 Opportunity cost
    positive_examples:
    - The region offers low electricity rates, reducing overall production expenses.
    - Affordable land prices have attracted several manufacturers to the area.
    - Labor costs in the region are among the lowest in the country.
    negative_examples:
    - Rising utility bills have increased operational costs for factories in the region.
    - High transportation expenses are a major concern for companies considering the area.
    - The cost of living in the region has driven up wage demands from workers.
    search_terms:
    - labor cost
    - wage rates
    - land prices
    - energy prices
    - utility bills
    - transportation expenses
    - construction costs
    - cost of living
    - municipal service fees
    - operating expenses
    - production costs
    - affordability for manufacturers
  H13:
    status: draft
    name: Economic environment
    factor: Economic factors
    definition: Economic environment refers to the overall economic conditions and dynamics in the region
      that affect the attractiveness of a production location for companies. This includes the general
      economic situation (purely economic), the business climate, the degree of free competition, the
      state of productive forces (such as technology and infrastructure), ongoing economic changes, and
      the level of competition between countries. Evidence for this criterion includes references to economic
      stability, growth, openness to business, and competitive advantages or disadvantages compared to
      other countries.
    notes: Do not include information that is specifically about costs or expenditures (see H12), market
      size or access (see H16), or business-related services (see H18). Focus on the broader economic
      context and environment, not on specific financial figures, taxes (H09), or government policies
      (H10).
    sub_criteria:
    - H13.01 Purely economic
    - H13.02 Business climate
    - H13.03 Free competition
    - H13.04 Forces of production
    - H13.05 Economic change
    - H13.06 The competition between countries
    positive_examples:
    - The region is known for its stable and growing economy, attracting new manufacturers.
    - A favorable business climate in the region has led to increased foreign investment.
    - The region benefits from open markets and strong competition, encouraging innovation.
    negative_examples:
    - Economic instability in the region has deterred several companies from setting up factories.
    - The region faces restrictive business practices, limiting free competition.
    - Recent economic downturns have weakened the region's attractiveness for new production sites.
    search_terms:
    - economic growth
    - business climate
    - investment environment
    - market openness
    - economic stability
    - competitive advantage
    - foreign investment
    - economic downturn
    - business-friendly
    - regional economy
    - competition between countries
    - economic change
  H14:
    status: draft
    name: Marketing
    factor: Economic factors
    definition: This criterion assesses the marketing-related advantages or disadvantages of a production
      location, focusing on the local marketing environment (H14.01) and the availability of marketing
      assistance (H14.02). Evidence includes references to the presence of marketing agencies, advertising
      infrastructure, promotional support, or a business climate that facilitates product promotion and
      market access for companies setting up production. Coders should look for mentions of resources
      or services that help companies market their products from this location.
    notes: Do not include general references to market size or demand (see H16 Market), or broader economic
      conditions (see H13 Economic environment). This criterion is specific to the support and infrastructure
      for marketing activities, not the existence of customers or overall economic health.
    sub_criteria:
    - H14.01 Marketing environment
    - H14.02 Marketing assistance
    positive_examples:
    - The region offers a strong network of advertising agencies and marketing consultants to support
      new businesses.
    - Local authorities provide subsidies for promotional campaigns to attract manufacturers.
    - A well-developed trade fair center in the region helps companies showcase their products to international
      buyers.
    negative_examples:
    - The region lacks professional marketing services, making it difficult for companies to promote their
      products.
    - There are few opportunities for businesses to participate in trade shows or industry exhibitions
      in the area.
    - Local firms report limited access to advertising channels, hindering their ability to reach new
      customers.
    search_terms:
    - advertising agencies
    - marketing support
    - trade fairs
    - promotional assistance
    - business promotion
    - marketing infrastructure
    - advertising channels
    - marketing services
    - product promotion
    - brand visibility
    - marketing consultants
    - trade exhibitions
  H15:
    status: draft
    name: Capital
    factor: Economic factors
    definition: Capital refers to the availability and movement of financial resources necessary for establishing
      and operating a production location. This includes both the accumulation of capital (such as access
      to investment, loans, or funding) and the circulation of capital (the ease and speed with which
      money flows in and out of the region for business activities). Evidence for this criterion includes
      mentions of investment climate, financing options, or financial infrastructure that affect a company's
      ability to secure and use capital at the site.
    notes: Do not include general economic conditions (see H13 Economic environment) or references to
      costs and expenditures (see H12 Cost/expenditure). Focus only on the presence, accessibility, and
      movement of financial resources, not on market size (H16 Market) or business services (H18 Business
      related service).
    sub_criteria:
    - H15.01 Accumulation of capital
    - H15.02 Capital circulation
    positive_examples:
    - The region has attracted significant foreign direct investment in recent years.
    - Local banks offer favorable loan terms to new manufacturing businesses.
    - A new industrial fund has been established to support factory development in the region.
    negative_examples:
    - Businesses in the region struggle to obtain financing for expansion.
    - Investment in the area has declined due to economic uncertainty.
    - Capital outflows have increased, making it harder for companies to access funds.
    search_terms:
    - investment inflow
    - access to finance
    - business loans
    - venture capital
    - bank lending
    - financial support
    - funding availability
    - capital investment
    - private equity
    - credit facilities
    - financing options
    - investment climate
  H16:
    status: draft
    name: Market
    factor: Economic factors
    definition: This criterion assesses the characteristics of the market at a potential production location,
      including the overall market size and scale (H16.01), the presence and accessibility of consumer
      markets (H16.02), and the stability or volatility of the market environment (H16.03). Evidence for
      this criterion includes information about the demand for products, the number of potential customers,
      and the predictability of market conditions in the region. Coders should look for statements indicating
      the attractiveness of the local or regional market for selling goods produced at the site.
    notes: Do not include information solely about the general economic environment (H13), business services
      (H18), or economic agglomeration (H19) unless they directly reference market size, consumer demand,
      or market stability. This criterion is distinct from H14 (Marketing), which focuses on marketing
      activities and strategies, and from H12 (Cost/expenditure), which concerns production costs rather
      than market opportunities.
    sub_criteria:
    - H16.01 Market size/economies scale
    - H16.02 Consumer market
    - H16.03 Market volatility
    positive_examples:
    - The region boasts a rapidly growing consumer base, making it an attractive market for manufacturers.
    - Strong local demand for electronics has encouraged several companies to set up new factories in
      the area.
    - Stable market conditions in the region have led to consistent sales growth for producers.
    negative_examples:
    - The region's shrinking population has led to a declining consumer market for new products.
    - Frequent market fluctuations have made it difficult for manufacturers to predict demand in the area.
    - Limited local demand means companies must rely heavily on exports from this region.
    search_terms:
    - consumer demand
    - market size
    - local market
    - regional sales
    - customer base
    - market growth
    - market stability
    - market volatility
    - demand for products
    - sales potential
    - market uncertainty
    - consumer market
  H17:
    status: draft
    name: External economies
    factor: Economic factors
    definition: This criterion assesses whether the region offers external economies that benefit companies
      considering production locations. It covers the area's business climate (such as the presence of
      supportive networks, suppliers, or a collaborative environment) and the impact of environmental
      degradation in urban centers (such as pollution or declining infrastructure) on business operations.
      Evidence includes references to positive or negative spillover effects from the local business environment
      or urban conditions that affect production attractiveness.
    notes: Do not include references to direct financial incentives (see H12 Cost/expenditure), general
      economic growth (see H13 Economic environment), or the presence of specific business services (see
      H18 Business related service). Focus on broader, indirect advantages or disadvantages arising from
      the local business ecosystem or urban environmental conditions, not individual company actions.
    sub_criteria:
    - H17.01 Area's business climate
    - H17.02 Environmental degradation in urban centers
    positive_examples:
    - The region's strong network of suppliers and partners has attracted several new manufacturers.
    - Local businesses benefit from a collaborative atmosphere that fosters innovation and shared resources.
    - The area's business-friendly environment has led to increased investment from international firms.
    negative_examples:
    - Environmental pollution in the region's urban centers has deterred new factories from opening.
    - Deteriorating infrastructure and air quality have made the region less appealing for manufacturers.
    - Companies cite the declining business climate as a reason for relocating production elsewhere.
    search_terms:
    - business climate
    - supplier network
    - industry cluster
    - business-friendly environment
    - local partnerships
    - urban pollution
    - infrastructure decline
    - business ecosystem
    - collaborative business environment
    - environmental problems
    - urban degradation
    - regional business network
  H18:
    status: draft
    name: Business related service
    factor: Economic factors
    definition: This criterion assesses the availability and quality of business-related services at a
      production location, specifically focusing on technology and computer services, banking services,
      and logistics. Evidence for this criterion includes references to the presence, accessibility, or
      development of IT support, financial institutions, or logistics providers that support industrial
      operations. Coders should look for mentions of these services as factors influencing the attractiveness
      of the site for companies.
    notes: Do not include general economic conditions (see H13 Economic environment) or references to
      market size (see H16 Market). This criterion is distinct from H17 External economies, which covers
      broader network effects and industry clusters, while H18 focuses on direct service providers such
      as IT, banking, and logistics. Exclude mentions of government incentives (see H10) or infrastructure
      unrelated to business services (see H02 Transportation system).
    sub_criteria:
    - H18.01 Technology and computer service
    - H18.02 Banking service
    - H18.03 Logistics
    positive_examples:
    - The region boasts a strong network of IT support firms and several major banks catering to industrial
      clients.
    - A new logistics hub has opened in the region, streamlining supply chains for local manufacturers.
    - Manufacturers in the region benefit from advanced computer services and reliable banking facilities.
    negative_examples:
    - Limited access to banking services has hindered business operations in the region.
    - The lack of reliable logistics providers makes the region less attractive for new factories.
    - Companies report frequent disruptions in local IT support, affecting production efficiency.
    search_terms:
    - IT support
    - banking services
    - logistics provider
    - supply chain services
    - financial services
    - computer services
    - business banking
    - freight forwarding
    - warehouse facilities
    - technology support
    - industrial logistics
    - transportation services
  H19:
    status: draft
    name: Economic agglomeration
    factor: Economic factors
    definition: Economic agglomeration refers to the concentration of related industries, businesses,
      and economic activities in a specific area, which can provide advantages such as shared resources,
      suppliers, services, and a skilled workforce. For coding, evidence for this criterion includes mentions
      of clusters of similar or supporting industries (industry agglomeration) or the presence of a dense
      network of economic activities and services (economies agglomeration) that benefit companies considering
      a production site.
    notes: Do not code general mentions of economic growth or prosperity unless they specifically reference
      the clustering of industries or business services. Distinguish this from H18 Business related service
      (which focuses on the availability of specific services) and H17 External economies (which covers
      benefits from external factors not tied to local clustering). Only code when the article discusses
      the advantages or disadvantages of being located near other businesses or industries.
    sub_criteria:
    - H19.01 Industry agglomeration
    - H19.02 Economies agglomeration
    positive_examples:
    - The region is home to a large number of automotive suppliers and manufacturers, making it attractive
      for new entrants.
    - Several major electronics firms have established operations in the region, creating a strong industrial
      cluster.
    - The area offers a dense network of supporting businesses and logistics providers, benefiting manufacturers.
    negative_examples:
    - The region lacks a significant industrial base, making it harder for new factories to find local
      partners.
    - Few related businesses operate in the area, limiting opportunities for collaboration and shared
      resources.
    - Manufacturers in the region report isolation from key suppliers and industry peers.
    search_terms:
    - industrial cluster
    - business hub
    - supplier network
    - manufacturing base
    - industry concentration
    - business ecosystem
    - regional supply chain
    - industrial park
    - business district
    - company cluster
    - manufacturing zone
    - supplier proximity
  H20:
    status: draft
    name: Population potential
    factor: Social factors
    definition: Population potential refers to the availability and characteristics of the local workforce
      at a production location. This includes the overall labor resource or population density, as well
      as the presence of skilled, semiskilled, and unskilled labor, and the availability of professional
      and technical personnel. Evidence for this criterion includes any mention of workforce size, skill
      levels, or the ease of hiring suitable employees for production operations.
    notes: Do not include references to general population growth or demographic trends unless they are
      directly linked to workforce availability. Exclude mentions of education systems (H23), unless they
      specifically relate to the current labor pool. Do not code for wage levels or labor costs (H12),
      or for quality of life factors (H22) unless they are explicitly tied to attracting or retaining
      workers.
    sub_criteria:
    - H20.01 Labor resource/population density
    - H20.02 Availability of skilled labor
    - H20.03 Availability of semiskilled labor
    - H20.04 Availability of unskilled labor
    - H20.05 Availability of professional and technical personnel
    positive_examples:
    - The region boasts a large pool of skilled workers, making it attractive for new manufacturing plants.
    - A high population density ensures that companies can easily recruit both semiskilled and unskilled
      labor in the region.
    - The presence of several technical colleges has resulted in a steady supply of professional and technical
      personnel for local factories.
    negative_examples:
    - The region faces a shortage of qualified workers, posing challenges for new factories.
    - Low population density in the area makes it difficult for companies to find enough labor.
    - Many businesses report difficulties hiring skilled technicians in the region.
    search_terms:
    - labor shortage
    - skilled workers
    - workforce availability
    - population density
    - hiring difficulties
    - unskilled labor
    - semiskilled workers
    - technical personnel
    - labor pool
    - recruitment challenges
    - employee supply
    - talent availability
  H21:
    status: draft
    name: Chance and purely personal factors
    factor: Social factors
    definition: This criterion covers factors related to chance events and personal preferences that influence
      the choice of a production location. It includes unexpected development opportunities, the owner's
      or key decision-maker's personal desire to live or work in the area, and the entrepreneurial skills
      present in the region. Evidence for this criterion includes references to serendipitous opportunities,
      personal motivations of owners, or notable entrepreneurial activity influencing site selection.
    notes: Do not include general economic conditions (see H13 Economic environment), market size (see
      H16 Market), or population characteristics (see H20 Population potential). This criterion is specific
      to individual or unpredictable factors, not systematic or structural ones. Exclude references to
      government incentives (see H10) or business services (see H18).
    sub_criteria:
    - H21.01 Development opportunities
    - H21.02 The owner's desire to live in the area
    - H21.03 Entrepreneurial skill
    positive_examples:
    - The owner's fondness for the region played a key role in the decision to build the new factory there.
    - A sudden opportunity to acquire land at a discount prompted the company to choose the region for
      its new plant.
    - The area's reputation for fostering successful entrepreneurs attracted the firm's investment.
    negative_examples:
    - The lack of entrepreneurial spirit in the region discouraged the company from setting up operations.
    - The owner expressed no personal interest in relocating to the region, reducing its appeal as a site.
    - Missed development opportunities in the region led the company to look elsewhere.
    search_terms:
    - personal preference
    - owner's decision
    - entrepreneurial spirit
    - unexpected opportunity
    - chance event
    - personal motivation
    - business founder
    - entrepreneurial talent
    - serendipity
    - personal reasons
    - development opportunity
    - owner's desire
  H22:
    status: draft
    name: Quality of life
    factor: Social factors
    definition: Quality of life at a production location refers to the overall well-being and living conditions
      for employees and their families, including housing quality, residential density, local lifestyle,
      labor union presence, community attitudes, insurance options, social and cultural environment, and
      the availability of essential services such as healthcare, fire, police, recreation, and environmental
      quality. Evidence for this criterion includes any mention of these aspects as factors influencing
      the attractiveness of the region for workers or companies considering a site. Sub-criteria include
      housing conditions, ambiance, labor relations, community support, insurance, social climate, service
      availability, and environmental quality.
    notes: Do not include information solely about wages, job availability, or direct economic incentives
      (see H12 Cost/expenditure, H16 Market). Exclude references to environmental pollution or climate
      change unless they are explicitly linked to general living conditions (see H06 Environmental pollution,
      H08 Climate change). Focus on aspects that affect daily life and well-being for residents and workers,
      not just operational or regulatory factors.
    sub_criteria:
    - H22.01 Quality of life
    - H22.02 Average occupants per housing room
    - H22.03 Residential housing
    - H22.04 The general ambiance and lifestyle of the area
    - H22.05 Labor Union
    - H22.06 Community attitude
    - H22.07 Insurance considerations
    - H22.08 Social and cultural climate
    - H22.09 Availability of services such as health, fire, police and recreational facilities
    - H22.10 Environmental quality
    positive_examples:
    - The region boasts modern housing developments and a vibrant cultural scene, making it attractive
      for relocating employees.
    - Local authorities have invested in new hospitals, recreational parks, and improved public safety
      services.
    - The community is known for its welcoming attitude towards newcomers and strong labor union support.
    negative_examples:
    - Many workers complain about overcrowded housing and limited access to basic services in the region.
    - The area suffers from poor air quality and a lack of recreational facilities, discouraging families
      from moving there.
    - Residents have expressed concerns about rising crime rates and inadequate health insurance options.
    search_terms:
    - quality of life
    - housing conditions
    - residential housing
    - community attitude
    - labor union
    - health services
    - public safety
    - recreational facilities
    - insurance coverage
    - social climate
    - environmental quality
    - lifestyle amenities
  H23:
    status: draft
    name: Education
    factor: Social factors
    definition: This criterion assesses the availability and quality of education, training, research,
      and technological development in the region as factors influencing a company's decision to locate
      production there. Evidence includes references to local educational institutions, workforce training
      programs, research centers, scientific advancements, and the presence or growth of high-tech industries.
      Sub-criteria include education and training (H23.01), research (H23.02), science and technological
      developments (H23.03), and the development of high-tech sectors (H23.04).
    notes: Do not include general mentions of workforce size or population (see H20 Population potential),
      or references to healthcare training unless directly tied to production-relevant skills (see H25
      Health system). Exclude mentions of business services (see H18 Business related service) unless
      they specifically relate to education, research, or technology development.
    sub_criteria:
    - H23.01 Education and training
    - H23.02 Research
    - H23.03 Science and technological developments
    - H23.04 The development of high-tech
    positive_examples:
    - The region boasts several technical universities and vocational schools that supply skilled workers
      to local industries.
    - A new research center focused on advanced manufacturing has opened in the region, attracting technology
      firms.
    - The region is known for its strong high-tech sector and ongoing investment in science and innovation.
    negative_examples:
    - The region suffers from a shortage of qualified engineers and lacks advanced training facilities.
    - Local companies report difficulties finding workers with up-to-date technical skills.
    - There is little investment in research or high-tech development in the region.
    search_terms:
    - skilled workforce
    - vocational training
    - technical university
    - research center
    - STEM graduates
    - innovation hub
    - high-tech industry
    - science park
    - technology cluster
    - education system
    - talent pool
    - workforce training
  H24:
    status: draft
    name: Epidemiology
    factor: Public health factors
    definition: This criterion assesses the epidemiological situation at a production location, focusing
      on factors such as the prevalence of diseases, risk of epidemics, environmental health conditions,
      and the vulnerability of the local population to health threats. Evidence for this criterion includes
      information about how common certain diseases are, the likelihood of outbreaks, the general health
      environment, and whether specific groups are at higher risk. These aspects are important for companies
      considering the health and safety of their workforce and the potential for operational disruptions.
    notes: Do not include general healthcare infrastructure (see H25 Health system) or public health monitoring
      systems (see H26 Public Health Surveillance). This criterion is specifically about the presence
      and risk of diseases and health conditions in the population, not about healthcare services or policies.
      Avoid coding general environmental pollution (see H06) unless it is directly linked to health outcomes.
    sub_criteria:
    - H24.01 Disease prevalence
    - H24.02 Epidemic risk
    - H24.03 Environmental health conditions
    - H24.04 Population vulnerability
    positive_examples:
    - The region has a low incidence of infectious diseases, making it a safe choice for new factories.
    - Recent reports confirm that the area has not experienced any major outbreaks in the past decade.
    - Local authorities highlight the region's clean environment and healthy population as key advantages
      for investors.
    negative_examples:
    - The region is currently facing a surge in dengue fever cases, raising concerns for potential investors.
    - A recent outbreak of respiratory illness has affected several industrial workers in the area.
    - Experts warn that poor sanitation in the region increases the risk of disease transmission among
      factory employees.
    search_terms:
    - disease outbreak
    - infectious disease cases
    - public health risk
    - disease-free zone
    - health hazards
    - epidemic threat
    - worker illness
    - community health
    - disease rates
    - sanitation issues
    - disease prevention
    - health crisis
  H25:
    status: draft
    name: Health system
    factor: Public health factors
    definition: This criterion assesses the quality and capacity of the health system at a potential production
      location, focusing on how well the area can provide emergency healthcare services, hospital and
      ICU capacity, availability of medical resources, and the ability to respond to health emergencies.
      Evidence includes references to the accessibility and readiness of hospitals, clinics, ambulances,
      and medical supplies that would support the health and safety of employees at the site. Consider
      whether the health system can handle both routine and crisis situations relevant to a company's
      workforce.
    notes: Do not include general public health statistics (e.g., disease rates) unless they directly
      relate to the health system's capacity or response. Exclude references to overall quality of life
      (H22), epidemiology (H24), or public health surveillance (H26) unless they specifically mention
      healthcare infrastructure or emergency response. Focus on the system's ability to deliver medical
      care, not on broader social or environmental health factors.
    sub_criteria:
    - H25.01 Accessibility to emergency healthcare services
    - H25.02 Hospital and ICU capacity
    - H25.03 Availability of medical resources
    - H25.04 Emergency response capability
    positive_examples:
    - The region boasts several modern hospitals with high ICU capacity and rapid emergency response teams.
    - Local authorities have recently invested in new ambulance fleets and expanded emergency healthcare
      services in the region.
    - The region's hospitals are well-stocked with medical supplies and have proven their ability to handle
      large-scale emergencies.
    negative_examples:
    - The region suffers from a shortage of hospital beds and limited access to emergency medical care.
    - Local hospitals in the region are frequently overwhelmed, with long wait times for critical care.
    - There is a lack of medical equipment and trained staff to respond to emergencies in the region.
    search_terms:
    - hospital capacity
    - ICU beds
    - emergency healthcare
    - ambulance service
    - medical resources
    - healthcare infrastructure
    - emergency response
    - hospital shortage
    - medical supply availability
    - critical care access
    - health system strain
    - emergency medical services
  H26:
    status: draft
    name: Public Health Surveillance
    factor: Public health factors
    definition: Public Health Surveillance refers to the presence and effectiveness of systems and protocols
      at a production location for monitoring, detecting, and responding to disease outbreaks and public
      health threats. This includes disease surveillance systems, early warning mechanisms, epidemic preparedness
      and response protocols, and inter-agency coordination and information sharing. Evidence for this
      criterion includes references to how well the region can identify and manage health risks that could
      impact business operations.
    notes: Do not include general healthcare quality (see H25 Health system) or references to public health
      outcomes without mention of monitoring, detection, or response systems. This criterion is distinct
      from H24 Epidemiology, which focuses on disease prevalence, not the systems for tracking or responding
      to them.
    sub_criteria:
    - H26.01 Disease surveillance systems
    - H26.02 Early warning mechanisms
    - H26.03 Epidemic preparedness and response protocols
    - H26.04 Inter-agency coordination and information sharing
    positive_examples:
    - The region has a robust disease monitoring network that quickly detects outbreaks.
    - Local authorities have implemented an early warning system for infectious diseases.
    - The region's agencies regularly coordinate to share health data and respond to public health threats.
    negative_examples:
    - The region lacks a centralized system for tracking disease outbreaks.
    - There is no formal protocol for responding to epidemics in the area.
    - Poor communication between health agencies has delayed responses to recent health threats.
    search_terms:
    - disease monitoring
    - outbreak detection
    - public health alert
    - early warning system
    - health data sharing
    - epidemic response plan
    - health agency coordination
    - infectious disease reporting
    - surveillance network
    - public health preparedness
    - emergency health protocols
